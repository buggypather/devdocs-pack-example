<h1>Undoing changes</h1>
<h2 id="file">Discard changes to one file</h2>
<pre data-language="bash">git restore path/to/file</pre>
<h2 id="commit">Undo a commit that was pushed</h2>
<p>Makes a new commit that reverses it, so history isn't rewritten.</p>
<pre data-language="bash">git revert &lt;commit&gt;</pre>
