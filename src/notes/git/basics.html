<h1>Git basics</h1>
<p>Save points for a project, on your computer and on GitHub.</p>
<h2 id="save">Save a checkpoint</h2>
<pre data-language="bash">git add .
git commit -m "What changed"</pre>
<h2 id="status">See what changed</h2>
<pre data-language="bash">git status
git log --oneline</pre>
<h2 id="push">Send it to GitHub</h2>
<pre data-language="bash">git push</pre>
